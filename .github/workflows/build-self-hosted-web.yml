name: Build self-hosted web app

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish ARM64 web image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fluxer_app_proxy/Dockerfile
          push: true
          provenance: false
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/fluxer-app-proxy-self-hosted:selfhost-${{ github.run_number }}
            ghcr.io/${{ github.repository_owner }}/fluxer-app-proxy-self-hosted:latest
          build-args: |
            BUILD_VERSION=selfhost-${{ github.run_number }}
            FLUXER_APP_PROXY_TIME_FREEZE_ENABLED=false
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/fluxer-app-proxy-self-hosted:buildcache-arm64
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/fluxer-app-proxy-self-hosted:buildcache-arm64,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
